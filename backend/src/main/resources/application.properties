spring.application.name=smart-inventory
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_inventory}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:smartinv_user}
spring.datasource.password=${DB_PASSWORD:change-me-local-only}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-please-32bytes-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@example.local}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
