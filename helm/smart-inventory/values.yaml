replicaCount: 2
image:
  repository: smart-inventory
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
containerPort: 8080
resources:
  requests: {cpu: 200m, memory: 384Mi}
  limits: {cpu: "1", memory: 768Mi}
config:
  dbHost: mysql
  dbPort: "3306"
  dbName: smart_inventory
secretName: smart-inventory-secret
