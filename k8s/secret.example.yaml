# =============================================================================
# Kubernetes Secret Template for Smart Inventory
# Copy to secret.yaml (which is git-ignored) and replace with your secure credentials:
#   Copy-Item k8s/secret.example.yaml k8s/secret.yaml
# Then apply:
#   kubectl apply -f k8s/secret.yaml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: smart-inventory-secret
  namespace: smart-inventory
type: Opaque
stringData:
  DB_USERNAME: "smartinv_user"
  DB_PASSWORD: "replace-with-secure-db-password"
  MYSQL_ROOT_PASSWORD: "replace-with-secure-root-password"
  JWT_SECRET: "replace-with-long-random-secret-at-least-32-bytes"
  BOOTSTRAP_ADMIN_PASSWORD: "replace-with-secure-admin-password"
