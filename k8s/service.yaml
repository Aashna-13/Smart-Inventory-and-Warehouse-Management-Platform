apiVersion: v1
kind: Service
metadata:
  name: smart-inventory
  namespace: smart-inventory
  labels:
    app: smart-inventory
spec:
  type: ClusterIP
  selector:
    app: smart-inventory
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: http-standard
      port: 80
      targetPort: 8080
